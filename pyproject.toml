[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trace2train"
version = "0.1.0"
description = "Turn failed agent traces (wrong tool, bad args, wrong format, over-refusal) into clean tool-call/behavior-fix SFT/DPO training data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "wane528" }]
keywords = ["llm", "fine-tuning", "sft", "dpo", "agent", "traces", "training-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
# For scripts/fetch_dataset.py — pulling public HF datasets for M4 validation.
data = [
    "datasets>=2.19",
]

[project.urls]
Homepage = "https://github.com/wane528/trace2train"
Repository = "https://github.com/wane528/trace2train"
Issues = "https://github.com/wane528/trace2train/issues"

[project.scripts]
trace2train = "trace2train.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/trace2train"]

[tool.hatch.build.targets.wheel.force-include]
"src/trace2train/demo/sample_traces.jsonl" = "trace2train/demo/sample_traces.jsonl"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Typer's Option/Argument-in-defaults is the idiomatic pattern.
# UP042: str+Enum is intentional for JSON/serialization compatibility.
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
# demo data uses long inline strings for readability
"src/trace2train/demo/build.py" = ["E501"]
